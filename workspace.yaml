name: Conduit
tabs:
  - name: Coding
    panes:
      - split: column
        panes:
          - command: copilot
          - panes:
              - id: npm-dev
                command: npm start
              - type: terminal
      - command: lazygit

  - name: Review
    active: true
    panes:
      - split: column
        panes:
          - command: codex
          - cloneOf: npm-dev
            collapsed: true
      - active: true

  - name: News
    panes:
      - url: https://espn.com
      - split: column
        panes:
          - id: hn-browser
            url: https://news.ycombinator.com
          - devToolsFor: hn-browser
