# Plugins for the renderer dev server (build/bun.dev.ts). The production
# build passes its plugins to Bun.build in build/bun.build.ts.
[serve.static]
plugins = ["./build/bun.tailwind.ts", "./build/bun.dev-csp.ts"]

[test]
environment = "happy-dom"
globals = "vitest"
preload = ["./tests/setup/bun-preload.ts"]
