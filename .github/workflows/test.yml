name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt --check

      - name: Run linter
        run: bun lint --quiet

      # The root project covers src and tests, and build/ covers the Bun build scripts and test preload
      - name: Type check
        run: bun check && bun check -p build

      - name: Run tests
        run: bun run test

  e2e:
    name: Run End-to-End Tests
    runs-on: macos-latest
    # Not a required check until it has passed 20 runs in a row.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package the app
        run: bun run package

      - name: Run end-to-end tests
        run: bun run e2e
        env:
          CONDUIT_E2E_ARTIFACTS: ${{ runner.temp }}/e2e

      - name: Upload screenshots and app logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
