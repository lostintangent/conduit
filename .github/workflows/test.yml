name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: npm ci
        env:
          # @vscode/ripgrep's postinstall calls the GitHub API, which rate-limits anonymous requests from shared runners
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run linter
        run: bun lint --quiet

      - name: Run tests
        run: bun run test
