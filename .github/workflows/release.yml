name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_SIGNING_PASSWORD }}

      - name: Build, sign, notarize, and publish
        run: bun run release
        env:
          CONDUIT_APPLE_ID_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
