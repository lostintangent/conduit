name: Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            artifact_name: Conduit-darwin-universal.zip
            artifact_path: |
              out/make/zip/darwin/**/*.zip
          - os: ubuntu-latest
            artifact_name: Conduit-linux
            artifact_path: |
              out/make/deb/**/*.deb
              out/make/rpm/**/*.rpm
          - os: windows-latest
            artifact_name: Conduit-windows
            artifact_path: |
              out/make/squirrel.windows/**/*.exe
              out/make/squirrel.windows/**/*.nupkg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python (for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Windows dependencies and configure build tools
        if: matrix.os == 'windows-latest'
        run: |
          # Install node-gyp globally
          npm install -g node-gyp

          # Get Python path and configure node-gyp
          $pythonPath = (Get-Command python).Path
          Write-Host "Python path: $pythonPath"
          npm config set python $pythonPath
          npm config set msvs_version 2022

          # Configure for Windows 10 SDK with ConPTY support
          npm config set target_arch x64

          # Display available Windows SDKs
          Write-Host "Available Windows SDKs:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object Name

          Write-Host "Node-gyp configuration:"
          npm config list
        shell: pwsh

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          # Install build tools for native modules
          npm install -g node-gyp
          # Ensure we have the latest Xcode command line tools
          xcode-select --install || true

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libgtk-3-dev \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            libasound2-dev

      - name: Install dependencies
        run: npm ci
        env:
          # Set minimum Windows SDK version for ConPTY support in node-pty
          npm_config_msvs_version: "2022"
          npm_config_target_arch: "x64"

      - name: Update version with build number
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const baseVersion = pkg.version.split('+')[0];
          const newVersion = baseVersion + '+build.${{ github.run_number }}';
          console.log('Updating version from', pkg.version, 'to', newVersion);
          pkg.version = newVersion;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Build version:', newVersion);
          "

      - name: Setup virtual display (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb
          export DISPLAY=:99.0
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Run tests
        run: npm run test:run

      - name: Build application
        run: npm run make
        env:
          # Increase memory limit for build process
          NODE_OPTIONS: --max_old_space_size=4096
          # Skip code signing on CI
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Set display for Ubuntu (headless)
          DISPLAY: ":99.0"
          # Ensure Windows builds use the correct MSVS version
          npm_config_msvs_version: "2022"

      - name: Debug - List build output
        run: |
          echo "Contents of out directory:"
          find out -type f -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.exe" -o -name "*.nupkg" || true
          echo "Full directory structure:"
          ls -la out/ || true
          ls -la out/make/ || true
          echo "Looking for executables in packaged app:"
          find out -type f -executable -name "*conduit*" -o -name "*Conduit*" || true
          echo "Complete out directory tree:"
          find out -type f || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 90
          # Fail if artifacts are not found - this indicates a build issue that should be fixed
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version.split('+')[0]")
          FULL_VERSION="${BASE_VERSION}+build.${{ github.run_number }}"
          TAG_VERSION="${BASE_VERSION}-build.${{ github.run_number }}"
          echo "version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_version=${TAG_VERSION}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag_version }}
          name: Release v${{ steps.version.outputs.tag_version }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
          body: |
            ## Installation

            ### macOS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/build/scripts/install.sh | bash
            ```

            ### Linux
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/build/scripts/install.sh | bash
            ```

            ### Windows
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/build/scripts/install.ps1 | iex
            ```

            ## Changes
            - Built from commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
