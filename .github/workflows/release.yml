name: Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            artifact_name: Conduit-darwin-universal.zip
            artifact_path: out/make/zip/darwin/**/*.zip
          - os: ubuntu-latest
            artifact_name: Conduit-linux
            artifact_path: out/make/{deb,rpm}/**/*.{deb,rpm}
          - os: windows-latest
            artifact_name: Conduit-windows
            artifact_path: out/make/squirrel.windows/**/*.{exe,nupkg}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python (for native modules)
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          # Install build tools for native modules
          npm install -g node-gyp
          # Ensure we have the latest Xcode command line tools
          xcode-select --install || true

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libgtk-3-dev \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            libasound2-dev

      - name: Install dependencies
        run: npm ci

      - name: Update version with build number
        run: |
          # Get base version (remove any existing build suffix)
          VERSION=$(node -p "require('./package.json').version.split('+')[0]")
          NEW_VERSION="${VERSION}+build.${{ github.run_number }}"
          echo "Updating version from $(node -p "require('./package.json').version") to $NEW_VERSION"

          # Use direct JSON modification instead of npm version to avoid conflicts
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$NEW_VERSION';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "Build version: $NEW_VERSION"

      - name: Setup virtual display (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb
          export DISPLAY=:99.0
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Run tests
        run: npm run test:run

      - name: Build application
        run: npm run make
        env:
          # Increase memory limit for build process
          NODE_OPTIONS: --max_old_space_size=4096
          # Skip code signing on CI
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Set display for Ubuntu (headless)
          DISPLAY: ":99.0"

      - name: Debug - List build output
        run: |
          echo "Contents of out directory:"
          find out -type f -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.exe" -o -name "*.nupkg" || true
          echo "Full directory structure:"
          ls -la out/ || true
          ls -la out/make/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 90

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Release v${{ steps.version.outputs.version }}-${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
          body: |
            ## Installation

            ### macOS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/build/scripts/install.sh | bash
            ```

            ### Linux
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/build/scripts/install.sh | bash
            ```

            ### Windows
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/build/scripts/install.ps1 | iex
            ```

            ## Changes
            - Built from commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
